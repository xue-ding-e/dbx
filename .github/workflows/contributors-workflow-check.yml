name: Contributors workflow checks

on:
  pull_request:
    paths:
      - .github/workflows/contributors.yml
      - .github/workflows/contributors-workflow-check.yml
      - .github/scripts/contributors-workflow.test.py
  push:
    branches: [fix/contributors-fork-guard-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate guards and token preflight
        run: python .github/scripts/contributors-workflow.test.py
